name: Checks

# The gates AGENTS.md § Tasks and verification asks of every PR. Renovate
# auto-merges only once these are green: with no check at all a PR's status
# stays pending and nothing merges (docs/skills/renovate.md § Auto-merge needs
# at least one check).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Without a version the action keeps whatever mise the runner has, or
          # takes the newest; mise.lock's contents depend on which mise wrote it
          # (docs/skills/mise.md § mise.lock). The action adds --locked to
          # `mise install` itself when mise.lock exists.
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3

      - name: mise.lock matches mise.toml
        run: mise run mise-lock --check

      - name: Rust is the pinned toolchain
        run: mise run toolchain-check

      - name: Lint and test
        # Quoted: in a plain scalar, `::: ` is a mapping key and the file fails
        # to parse (docs/skills/ci.md § Writing the workflow).
        run: "mise run lint ::: test"

      - name: Docs references
        run: mise run docs-links
