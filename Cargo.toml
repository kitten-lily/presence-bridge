[package]
name = "presence-bridge"
version = "0.2.0"
edition = "2024"
# The Rust krytis builds this with (freedesktop-sdk 26.08.2), pinned in mise.toml.
rust-version = "1.98"
description = "Discord Rich Presence for games that sandboxed (flatpak) Discord clients cannot detect"
repository = "https://github.com/kitten-lily/presence-bridge"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
